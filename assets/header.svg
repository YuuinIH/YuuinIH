<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" aria-label="Yuuin systems profile banner" role="img" viewBox="0 0 1200 280"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#070b16"/><stop offset="100%" stop-color="#0d1220"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#6ee7f2"><animate attributeName="stop-color" dur="10s" repeatCount="indefinite" values="#6ee7f2;#8b9cf6;#6ee7f2"/></stop><stop offset="100%" stop-color="#9b8cf6"><animate attributeName="stop-color" dur="10s" repeatCount="indefinite" values="#9b8cf6;#6ee7f2;#9b8cf6"/></stop></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#8aa4c8" stroke-opacity=".045" stroke-width="1" d="M40 0H0V40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="1.6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes blink{0%,48%{opacity:1}49%{opacity:0}}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.title{font-size:68px;font-weight:800;letter-spacing:5px}.subtitle{font-size:16px;letter-spacing:2.6px;fill:#9caac4}.telemetry{font-size:13px;letter-spacing:1px;fill:#93a4bf}.dim{fill:#5f6f8a}.blink{animation:blink 1.1s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.blink{animation:none}}</style></defs><rect width="1200" height="280" fill="url(#bg)" rx="20"/><rect width="1200" height="280" fill="url(#grid)" rx="20"/><path fill="none" stroke="url(#accent)" stroke-opacity=".5" stroke-width="1.5" d="M0 46H300L320 66H500"/><path fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="1.5" d="M1200 232H930L910 212H760"/><text x="76" y="124" fill="url(#accent)" class="mono title" filter="url(#glow)">YUUIN//</text><text x="80" y="164" class="mono subtitle">SYSTEMS · DISTRIBUTED · ML INFRA · RUNTIME</text><g class="mono telemetry"><text x="80" y="212"><tspan class="dim">STATUS</tspan><tspan fill="#7fd9b0" dx="16">ONLINE</tspan></text><text x="242" y="212"><tspan class="dim">MODE</tspan><tspan fill="#b8b7d9" dx="16">BUILD / BREAK / UNDERSTAND</tspan></text><text x="80" y="240"><tspan fill="#6ee7f2">&gt;</tspan><tspan fill="#c5cfdf" dx="10">software systems are where abstractions meet reality</tspan><tspan fill="#9b8cf6" class="blink">_</tspan></text></g><rect width="1198" height="278" x="1" y="1" fill="none" stroke="#7d8eaa" stroke-opacity=".18" stroke-width="1" rx="19"/></svg>