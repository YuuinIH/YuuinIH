<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yuuin systems profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7f2">
        <animate attributeName="stop-color" values="#6ee7f2;#8b9cf6;#6ee7f2" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9b8cf6">
        <animate attributeName="stop-color" values="#9b8cf6;#6ee7f2;#9b8cf6" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa4c8" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 68px; font-weight: 800; letter-spacing: 5px; }
      .subtitle { font-size: 16px; letter-spacing: 2.6px; fill: #9caac4; }
      .telemetry { font-size: 13px; letter-spacing: 1px; fill: #93a4bf; }
      .dim { fill: #5f6f8a; }
      .blink { animation: blink 1.1s steps(1,end) infinite; }
      @keyframes blink { 0%,48% { opacity: 1 } 49%,100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="20" fill="url(#grid)"/>

  <path d="M0 46H300L320 66H500" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity=".5"/>
  <path d="M1200 232H930L910 212H760" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity=".35"/>

  <text x="76" y="124" class="mono title" fill="url(#accent)" filter="url(#glow)">YUUIN//</text>
  <text x="80" y="164" class="mono subtitle">SYSTEMS · DISTRIBUTED · ML INFRA · RUNTIME</text>

  <g class="mono telemetry">
    <text x="80" y="212"><tspan class="dim">STATUS</tspan><tspan dx="16" fill="#7fd9b0">ONLINE</tspan></text>
    <text x="242" y="212"><tspan class="dim">MODE</tspan><tspan dx="16" fill="#b8b7d9">BUILD / BREAK / UNDERSTAND</tspan></text>
    <text x="80" y="240"><tspan fill="#6ee7f2">&gt;</tspan><tspan dx="10" fill="#c5cfdf">software systems are where abstractions meet reality</tspan><tspan class="blink" fill="#9b8cf6">_</tspan></text>
  </g>

  <rect x="1" y="1" width="1198" height="278" rx="19" fill="none" stroke="#7d8eaa" stroke-opacity=".18" stroke-width="1"/>
</svg>